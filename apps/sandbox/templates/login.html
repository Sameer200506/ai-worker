{% extends "base.html" %}
{% block login %}
<div class="login">
  <h1>CentrAlign Internal</h1>
  <p class="muted">Simulated company portal. Demo credentials only.</p>
  {% if error %}<p class="err">Invalid username or password.</p>{% endif %}
  <form method="post" action="/login">
    <p><input name="username" placeholder="username" value="demo" /></p>
    <p><input name="password" type="password" placeholder="password" value="demo123" /></p>
    <button type="submit" id="login-submit">Sign in</button>
  </form>
</div>
{% endblock %}
