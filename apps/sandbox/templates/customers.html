{% extends "base.html" %}
{% block content %}
<div class="top">
  <h1>Customers</h1>
  <form class="row">
    <input type="text" name="q" value="{{ q }}" placeholder="Search customers" />
    <button type="submit">Search</button>
  </form>
</div>
<div class="card">
  <table>
    <tr><th>ID</th><th>Name</th><th>Status</th><th>Contact</th><th>Email</th></tr>
    {% for row in customers %}
    <tr>
      <td><a href="/customers/{{ row.customer_id }}">{{ row.customer_id }}</a></td>
      <td>{{ row.name }}</td>
      <td>{{ row.status }}</td>
      <td>{{ row.contact }}</td>
      <td>{{ row.email }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
